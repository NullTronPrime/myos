[workspace]
resolver = "2"
members = ["crates/parasyte_core", "crates/parasyte_plat", "crates/parasyteos"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
parasyte_core = { path = "crates/parasyte_core" }
parasyte_plat = { path = "crates/parasyte_plat" }

[profile.release]
panic = "abort"
overflow-checks = true
