[package]
name = "myos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A parasitic OS: a kernel that runs as an ordinary Linux process."

[[bin]]
name = "myos"
path = "src/main.rs"

[dependencies]
oscore = { workspace = true }
osplat = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
